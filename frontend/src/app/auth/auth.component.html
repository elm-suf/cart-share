<div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/50 backdrop-blur-sm"
     (click)="onBackdropClick($event)">
  <div class="bg-card w-full sm:max-w-sm rounded-t-2xl sm:rounded-xl border border-border shadow-xl flex flex-col relative"
       (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="flex items-center justify-between p-5 pb-0">
      <div>
        <h2 class="text-base font-semibold text-foreground tracking-tight">
          {{ isSignUp() ? 'Create account' : 'Welcome back' }}
        </h2>
        <p class="text-xs text-muted-foreground mt-0.5">
          {{ isSignUp() ? 'Sync your grocery lists across all devices' : 'Access your saved grocery lists' }}
        </p>
      </div>
      <button
        (click)="close.emit()"
        class="size-8 flex items-center justify-center rounded-lg text-muted-foreground hover:text-foreground hover:bg-muted transition-colors cursor-pointer border-none bg-transparent"
        aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Divider -->
    <div class="h-px bg-border mx-5 mt-4"></div>

    <!-- Form -->
    <form (submit)="onSubmit(); $event.preventDefault()" class="flex flex-col gap-4 p-5">

      @if (errorMessage()) {
        <div class="bg-destructive/8 border border-destructive/20 text-destructive text-xs p-3 rounded-lg font-medium">
          {{ errorMessage() }}
        </div>
      }

      <div class="flex flex-col gap-1.5">
        <label hlmLabel for="auth-username" class="text-xs font-medium text-foreground">Username</label>
        <input
          hlmInput
          id="auth-username"
          type="text"
          placeholder="e.g. alex"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
          name="username"
          required
          class="h-9 text-sm"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label hlmLabel for="auth-password" class="text-xs font-medium text-foreground">Password</label>
        <input
          hlmInput
          id="auth-password"
          type="password"
          placeholder="••••••••"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          required
          class="h-9 text-sm"
        />
      </div>

      <button
        hlmBtn
        type="submit"
        [disabled]="loading()"
        class="w-full h-9 mt-1"
      >
        @if (loading()) {
          <hlm-spinner />
        } @else {
          {{ isSignUp() ? 'Create account' : 'Sign in' }}
        }
      </button>
    </form>

    <!-- Footer -->
    <div class="px-5 pb-5 text-center">
      <p class="text-xs text-muted-foreground">
        {{ isSignUp() ? 'Already have an account?' : "Don't have an account?" }}
        <button (click)="toggleMode()" class="text-foreground font-medium border-none bg-transparent cursor-pointer ml-1 hover:underline underline-offset-4">
          {{ isSignUp() ? 'Sign in' : 'Sign up' }}
        </button>
      </p>
    </div>

  </div>
</div>
